name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokenexchange
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokenexchange
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123
      NEXT_TELEMETRY_DISABLED: "1"
      STRIPE_SECRET_KEY: sk_test_e2e
      STRIPE_WEBHOOK_SECRET: whsec_e2e
      STRIPE_API_BASE: http://localhost:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - name: End-to-end against mock upstreams
        run: |
          npm start &
          for i in $(seq 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npx tsx scripts/e2e.ts
